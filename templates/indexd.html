<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetCDF Weather Data Mapping</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.30.1.min.js"></script>
    <style>
        .drop-zone {
            border: 2px dashed #007bff;
            border-radius: 10px;
            padding: 4px;
            text-align: center;
            height: 100%;
            width: 100%;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 2px 0;
        }
        .drop-zone:hover {
            background-color: #f8f9fa;
        }
        .drop-zone.dragover {
            background-color: #e3f2fd;
            border-color: #2196f3;
        }
        .map-container {
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin: 20px 0;
        }
        .chart-container {
            margin: 20px 0;
            height: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        #loading {
            display: none;
        }
        .file-info {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            margin: 0px 0px;
        }
        .row {
            display: flex;
            align-items: stretch;
        }
        #fileInfo {
            max-height: 200px;
            overflow-y: auto;
        }
        #visualizationSection .card {
            min-height: 450px;
        }
    </style>
</head>
<body>
    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="text-center mb-4 text-2xl font-bold text-blue-600">NetCDF Weather Data Mapping</h1>
                
                <div class="row">
                    <!-- Upload Section -->
                    <div class="col-md-6">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h4 class="mb-0">File</h4>
                                <h4 class="mb-0">Time Range</h4>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <!-- Upload Section -->
                                    <div class="col-md-6">
                                        <div class="drop-zone" id="dropZone">
                                            <i class="fas fa-cloud-upload-alt fa-3x mb-3 text-primary"></i>
                                            <p class="mb-2">Drop .nc file</p>
                                            <p class="text-muted">Max size: 100MB</p>
                                            <input type="file" id="fileInput" accept=".nc" style="display: none;">
                                        </div>
                                        <div id="loading" class="text-center mt-3">
                                            <div class="spinner-border" role="status">
                                                <span class="visually-hidden">Loading...</span>
                                            </div>
                                            <p class="mt-2">Processing NetCDF file...</p>
                                        </div>
                                    </div>
                                    <!-- Time Range Section -->
                                    <div class="col-md-6">
                                        <div class="card">
                                            <div class="card-body">
                                                <label for="startDate">Start Date:</label>
                                                <input type="date" id="startDate" class="form-control mb-2">
                                                <label for="endDate">End Date:</label>
                                                <input type="date" id="endDate" class="form-control mb-2">
                                                <button class="btn btn-primary" onclick="window.applyDateRange()">Apply</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- File Information Section -->
                    <div class="col-md-6 d-flex">
                        <div class="card flex-fill">
                            <div class="card-header">
                                <h4>File Information</h4>
                            </div>
                            <div class="card-body">
                                <div id="fileInfo" class="file-info" style="height:100%; overflow-y:auto; display:none">
                                    <button id="showFileInfo" class="btn btn-success mt-2" style="display: none;">Show File Info</button>
                                    <div id="fileDetails"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Map + Charts Side by Side -->
                <div id="visualizationSection" class="mt-3" style="display: none;">
                    <div class="row g-3">
                        <!-- Map Column -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header">
                                    <h3>Data Coverage Map</h3>
                                    <p class="mb-0">Click on the map to select a point</p>
                                </div>
                                <div class="card-body d-flex flex-column">
                                    <div id="mapContainer" class="map-container flex-grow-1" style="height: 100%;"></div>
                                    <button id="downloadCsvBtn" class="btn btn-success mt-2" style="display:none;">
                                        <i class="fas fa-download"></i> Download CSV
                                    </button>
                                    <button id="downloadTxtBtn" class="btn btn-primary mt-2" style="display:none;">
                                        <i class="fas fa-file-word"></i> Download Txt
                                    </button>
                                    <button id="downloadDocxBtn" class="btn btn-primary mt-2" style="display:none;">
                                        <i class="fas fa-file-word"></i> Download Docx
                                    </button>
                                </div>
                            </div>
                        </div>
                        <!-- Charts Column -->
                        <div class="col-md-6">
                            <div class="card h-100">
                                <div class="card-header">
                                    <h3>Time Series Data</h3>
                                    <p id="selectedCoords" class="mb-0 text-muted"></p>
                                </div>
                                <div class="card-body">
                                    <div id="chartsContainer" class="flex-grow-1" style="height: 100%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Selected Coordinates Display -->
                <div id="gridSection" style="display: none;">
                    <div class="card"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
